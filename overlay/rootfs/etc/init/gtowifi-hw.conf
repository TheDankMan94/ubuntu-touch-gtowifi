# gtowifi-hw - start the Qualcomm DSPs that Android's vendor init would start
#
# On LineageOS this is done by init.qcom.rc + wcnss_service, which Halium does not run.
# Their firmware is on the apnhlos partition (mounted at /vendor/firmware_mnt), which is not
# in this kernel's firmware search path, so add it first.
#   - ADSP (audio DSP): needed before PulseAudio's droid module can open the audio HAL.
#   - WCNSS/pronto (Wi-Fi): opening /dev/wcnss_wlan boots its firmware; writing "sta" to the
#     built-in prima driver's fwpath parameter starts the driver, which creates wlan0.
# Log: /var/log/gtowifi-hw.log

description "gtowifi: boot ADSP and WCNSS firmware, start Wi-Fi driver"

start on android
task

script
    exec >>/var/log/gtowifi-hw.log 2>&1
    echo "=== $(date) gtowifi-hw start"

    # upstart runs scripts with "sh -e"; every step below handles its own failure instead.
    # The firmware partition is mounted by mount-android.sh (needs /vendor/firmware_mnt to exist
    # on the vendor partition). The WCNSS driver cannot retry after a failed firmware load
    # (it drops its state until reboot), so never trigger it before the firmware is there.
    i=0
    while [ ! -e /vendor/firmware_mnt/image/wcnss.mdt ] && [ $i -lt 40 ]; do
        sleep 0.5; i=$((i+1))
    done
    if [ ! -e /vendor/firmware_mnt/image/wcnss.mdt ]; then
        echo "firmware partition not mounted at /vendor/firmware_mnt; not starting ADSP/WCNSS"
        exit 0
    fi

    if echo -n /vendor/firmware_mnt/image > /sys/module/firmware_class/parameters/path; then
        echo "firmware path: $(cat /sys/module/firmware_class/parameters/path)"
    fi

    if [ -e /sys/kernel/boot_adsp/boot ]; then
        if echo 1 > /sys/kernel/boot_adsp/boot; then echo "adsp boot requested"; fi
    else
        echo "no /sys/kernel/boot_adsp/boot"
    fi

    # Opening the node triggers the WCNSS firmware load (wcnss_node_open -> wcnss_trigger_config)
    if [ -e /dev/wcnss_wlan ]; then
        if sh -c 'exec 3<>/dev/wcnss_wlan'; then echo "wcnss_wlan opened"; else echo "wcnss_wlan open FAILED"; fi
    else
        echo "no /dev/wcnss_wlan"
    fi

    # MAC addresses (LineageOS: wcnss_service). Samsung stores this tablet's Wi-Fi MAC on efs.
    # Without this the Wi-Fi driver uses Qualcomm's placeholder 00:0a:f5:xx:xx:xx.
    # Bluetooth: the Qualcomm BT HAL and bluebinder read persist.vendor.service.bdroid.bdaddr;
    # this tablet has no stored BT address, so derive one from the Wi-Fi MAC (last byte - 1;
    # the Wi-Fi driver uses +1..+3 for its extra interfaces).
    mac=$(tr -d ' \r\n' < /mnt/vendor/efs/wifi/.mac.info 2>/dev/null | tr 'A-F' 'a-f')
    if echo "$mac" | grep -qE '^([0-9a-f]{2}:){5}[0-9a-f]{2}$'; then
        node=$(find /sys/devices/platform -name wcnss_mac_addr 2>/dev/null | head -n1)
        if [ -n "$node" ] && echo "$mac" > "$node"; then echo "wifi mac set from efs"; else echo "wifi mac NOT set (node: $node)"; fi
        last=$(printf '%d' "0x${mac##*:}")
        bt=$(printf '%s:%02x' "${mac%:*}" $(( (last + 255) % 256 )) | tr 'a-f' 'A-F')
        if setprop persist.vendor.service.bdroid.bdaddr "$bt"; then echo "bt address property set"; fi
    else
        echo "no usable Wi-Fi MAC in /mnt/vendor/efs/wifi/.mac.info"
    fi

    # The driver waits up to ~10 s for WCNSS to come up by itself
    if [ -e /sys/module/wlan/parameters/fwpath ]; then
        if echo sta > /sys/module/wlan/parameters/fwpath; then echo "wlan driver started"; else echo "wlan driver start FAILED"; fi
    else
        echo "no /sys/module/wlan/parameters/fwpath"
    fi

    ip link show wlan0 || echo "wlan0 missing"
    echo "=== $(date) gtowifi-hw done"
end script
